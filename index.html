<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="color-scheme" content="light dark">
  <title>인원이동 관리</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div id="banner" class="banner" hidden>연결 끊김 — 자동으로 다시 연결합니다</div>
  <main id="app">
    <div class="loading">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body"><g class="m-head">
          <ellipse class="m-hand" cx="27" cy="92" rx="7" ry="6"/>
          <circle class="m-ear" cx="36" cy="54" r="11"/>
          <circle class="m-ear" cx="84" cy="54" r="11"/>
          <circle class="m-ear-in" cx="36" cy="54" r="5.5"/>
          <circle class="m-ear-in" cx="84" cy="54" r="5.5"/>
          <ellipse class="m-skin" cx="60" cy="78" rx="34" ry="30"/>
          <circle class="m-eye" cx="42" cy="81" r="2.6"/>
          <circle class="m-eye" cx="78" cy="81" r="2.6"/>
          <circle class="m-blush" cx="35" cy="91" r="4.5"/>
          <circle class="m-blush" cx="85" cy="91" r="4.5"/>
          <ellipse class="m-muzzle" cx="60" cy="92" rx="14" ry="11"/>
          <ellipse class="m-nose" cx="60" cy="87" rx="4.5" ry="3.2"/>
          <ellipse class="m-mouth-o" cx="60" cy="96" rx="2.6" ry="3.4"/>
          <g class="m-arm">
            <path class="m-armline" d="M90 84 L101 66"/>
            <ellipse class="m-hand" cx="102" cy="62" rx="7" ry="7"/>
          </g>
        </g></g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
    </div>
  </main>

  <template id="tpl-mascot">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body"><g class="m-head">
          <ellipse class="m-hand" cx="27" cy="92" rx="7" ry="6"/>
          <circle class="m-ear" cx="36" cy="54" r="11"/>
          <circle class="m-ear" cx="84" cy="54" r="11"/>
          <circle class="m-ear-in" cx="36" cy="54" r="5.5"/>
          <circle class="m-ear-in" cx="84" cy="54" r="5.5"/>
          <ellipse class="m-skin" cx="60" cy="78" rx="34" ry="30"/>
          <circle class="m-eye" cx="42" cy="81" r="2.6"/>
          <circle class="m-eye" cx="78" cy="81" r="2.6"/>
          <circle class="m-blush" cx="35" cy="91" r="4.5"/>
          <circle class="m-blush" cx="85" cy="91" r="4.5"/>
          <ellipse class="m-muzzle" cx="60" cy="92" rx="14" ry="11"/>
          <ellipse class="m-nose" cx="60" cy="87" rx="4.5" ry="3.2"/>
          <ellipse class="m-mouth-o" cx="60" cy="96" rx="2.6" ry="3.4"/>
          <g class="m-arm">
            <path class="m-armline" d="M90 84 L101 66"/>
            <ellipse class="m-hand" cx="102" cy="62" rx="7" ry="7"/>
          </g>
        </g></g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
  </template>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
