<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="color-scheme" content="light dark">
  <title>인원이동 관리</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="banner" class="banner" hidden>연결 끊김 — 자동으로 다시 연결합니다</div>
  <main id="app">
    <div class="loading">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body">
          <ellipse class="m-foot" cx="48" cy="107" rx="9" ry="4"/>
          <ellipse class="m-foot" cx="72" cy="107" rx="9" ry="4"/>
          <g class="m-head">
          <ellipse class="m-wing" cx="28" cy="88" rx="7" ry="11" transform="rotate(25 28 88)"/>
          <ellipse class="m-skin" cx="60" cy="76" rx="34" ry="31"/>
          <path class="m-tuft" d="M58 46 C56 38 62 35 64 40 M60 46 C62 39 68 39 67 44"/>
          <circle class="m-eye" cx="43" cy="74" r="2.6"/>
          <circle class="m-eye" cx="77" cy="74" r="2.6"/>
          <circle class="m-blush" cx="35" cy="85" r="4.5"/>
          <circle class="m-blush" cx="85" cy="85" r="4.5"/>
          <ellipse class="m-bill-low" cx="60" cy="91" rx="9" ry="4.5"/>
          <ellipse class="m-bill" cx="60" cy="86" rx="13" ry="5.5"/>
          <g class="m-arm">
            <ellipse class="m-wing" cx="97" cy="68" rx="7" ry="12" transform="rotate(-30 97 68)"/>
          </g>
        </g></g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
    </div>
  </main>

  <template id="tpl-mascot">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body">
          <ellipse class="m-foot" cx="48" cy="107" rx="9" ry="4"/>
          <ellipse class="m-foot" cx="72" cy="107" rx="9" ry="4"/>
          <g class="m-head">
          <ellipse class="m-wing" cx="28" cy="88" rx="7" ry="11" transform="rotate(25 28 88)"/>
          <ellipse class="m-skin" cx="60" cy="76" rx="34" ry="31"/>
          <path class="m-tuft" d="M58 46 C56 38 62 35 64 40 M60 46 C62 39 68 39 67 44"/>
          <circle class="m-eye" cx="43" cy="74" r="2.6"/>
          <circle class="m-eye" cx="77" cy="74" r="2.6"/>
          <circle class="m-blush" cx="35" cy="85" r="4.5"/>
          <circle class="m-blush" cx="85" cy="85" r="4.5"/>
          <ellipse class="m-bill-low" cx="60" cy="91" rx="9" ry="4.5"/>
          <ellipse class="m-bill" cx="60" cy="86" rx="13" ry="5.5"/>
          <g class="m-arm">
            <ellipse class="m-wing" cx="97" cy="68" rx="7" ry="12" transform="rotate(-30 97 68)"/>
          </g>
        </g></g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
  </template>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
