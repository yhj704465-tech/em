<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="color-scheme" content="light dark">
  <title>인원이동 관리</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="banner" class="banner" hidden>연결 끊김 — 자동으로 다시 연결합니다</div>
  <main id="app">
    <div class="loading">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body">
          <ellipse class="m-hand" cx="27" cy="92" rx="7" ry="6"/>
          <ellipse class="m-skin" cx="60" cy="78" rx="34" ry="30"/>
          <path class="m-helmet" d="M30 66 A30 28 0 0 1 90 66 Z"/>
          <path class="m-ridge" d="M60 39 V64"/>
          <rect class="m-brim" x="22" y="62" width="76" height="9" rx="4.5"/>
          <ellipse class="m-eye" cx="48" cy="82" rx="3.2" ry="4.2"/>
          <ellipse class="m-eye" cx="72" cy="82" rx="3.2" ry="4.2"/>
          <circle class="m-blush" cx="39" cy="90" r="5"/>
          <circle class="m-blush" cx="81" cy="90" r="5"/>
          <path class="m-mouth" d="M55 90 Q60 95 65 90"/>
          <g class="m-arm">
            <path class="m-armline" d="M90 84 L101 66"/>
            <ellipse class="m-hand" cx="102" cy="62" rx="7" ry="7"/>
          </g>
        </g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
    </div>
  </main>

  <template id="tpl-mascot">
    <div class="mascot-wrap">
      <div class="mascot-bubble">안녕하세요!</div>
      <svg class="mascot" viewBox="0 0 120 124" aria-hidden="true">
        <ellipse class="m-shadow" cx="60" cy="114" rx="30" ry="5"/>
        <g class="m-body">
          <ellipse class="m-hand" cx="27" cy="92" rx="7" ry="6"/>
          <ellipse class="m-skin" cx="60" cy="78" rx="34" ry="30"/>
          <path class="m-helmet" d="M30 66 A30 28 0 0 1 90 66 Z"/>
          <path class="m-ridge" d="M60 39 V64"/>
          <rect class="m-brim" x="22" y="62" width="76" height="9" rx="4.5"/>
          <ellipse class="m-eye" cx="48" cy="82" rx="3.2" ry="4.2"/>
          <ellipse class="m-eye" cx="72" cy="82" rx="3.2" ry="4.2"/>
          <circle class="m-blush" cx="39" cy="90" r="5"/>
          <circle class="m-blush" cx="81" cy="90" r="5"/>
          <path class="m-mouth" d="M55 90 Q60 95 65 90"/>
          <g class="m-arm">
            <path class="m-armline" d="M90 84 L101 66"/>
            <ellipse class="m-hand" cx="102" cy="62" rx="7" ry="7"/>
          </g>
        </g>
      </svg>
      <div class="mascot-text"><span class="mascot-label">불러오는 중</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
  </template>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
